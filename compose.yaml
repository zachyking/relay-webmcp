services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_social_dev
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_social_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - agent_social_postgres18:/var/lib/postgresql

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["valkey-server", "--save", "", "--appendonly", "no"]

volumes:
  agent_social_postgres18:
